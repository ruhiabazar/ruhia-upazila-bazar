<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments</title><style>body{font-family:Arial;background:#f4f8f5;color:#173b2d;margin:0}.w{max-width:700px;margin:auto;padding:18px}.h,.box{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 5px 18px #0001}.h{background:#0b6e4f;color:#fff}input,select,button{width:100%;padding:13px;margin:6px 0;box-sizing:border-box;border-radius:12px;border:1px solid #ccd8d2}button{background:#0b6e4f;color:#fff;border:0;font-weight:700}.note{background:#fff8df;padding:12px;border-radius:12px}.item{border-top:1px solid #eee;padding:11px 0}.back{color:#0b6e4f;font-weight:700}</style></head><body><main class="w"><div class="h"><h2>💰 Payments</h2><div id="shop">লোড হচ্ছে...</div></div><div class="box"><div class="note">bKash বা Nagad-এ Send Money করার পর নম্বর ও TrxID দিন। প্রথমে pending থাকবে।</div><select id="pkg"><option value="499">৳499 Package</option><option value="999">৳999 Package</option></select><select id="method"><option>bKash</option><option>Nagad</option></select><input id="sender" placeholder="Send Money নম্বর"><input id="trx" placeholder="Transaction ID (TrxID)"><button id="send">Payment তথ্য জমা দিন</button><p id="msg"></p></div><div class="box"><h3>Payment History</h3><div id="list">লোড হচ্ছে...</div></div><a class="back" href="owner-dashboard.html">← Dashboard</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>let u,s;async function init(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='owner-login.html';return}u=session.user;const r=await supabaseClient.from('shops').select('id,shop_name').eq('owner_id',u.id).order('id',{ascending:false}).limit(1).maybeSingle();s=r.data;if(!s){shop.textContent='আগে My Shop-এ দোকানের তথ্য সংরক্ষণ করুন।';send.disabled=true}else{shop.textContent='দোকান: '+s.shop_name;load()}}send.onclick=async()=>{if(!s)return;const p=pkg.value,m=method.value,sn=sender.value.trim(),t=trx.value.trim();if(!sn||!t){msg.textContent='নম্বর এবং TrxID দিন।';return}const{error}=await supabaseClient.from('payments').insert({shop_id:s.id,owner_id:u.id,package_type:p,amount:Number(p),method:m,sender_number:sn,trx_id:t,status:'pending'});msg.textContent=error?error.message:'Payment তথ্য সফলভাবে জমা হয়েছে।';if(!error){sender.value='';trx.value='';load()}};async function load(){const{data,error}=await supabaseClient.from('payments').select('*').eq('owner_id',u.id).eq('shop_id',s.id).order('created_at',{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=data?.length?data.map(x=>`<div class="item"><b>৳${x.amount}</b> • ${x.method} • ${x.status}<br>TrxID: ${x.trx_id}<br><small>${new Date(x.created_at).toLocaleString('bn-BD')}</small></div>`).join(''):'এখনো কোনো payment নেই।'}init();</script></body></html>
