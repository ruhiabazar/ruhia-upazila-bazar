<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics</title><style>body{font-family:Arial;background:#f4f8f5;color:#173b2d;margin:0}.w{max-width:700px;margin:auto;padding:18px}.h,.box{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 5px 18px #0001}.h{background:#0b6e4f;color:#fff}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.s{background:#eef8f2;border-radius:15px;padding:18px;text-align:center}.n{font-size:28px;font-weight:800;color:#0b6e4f}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}.back{color:#0b6e4f;font-weight:700}@media(max-width:500px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><main class="w"><div class="h"><h2>📊 Analytics</h2><div id="shop">লোড হচ্ছে...</div></div><div class="box"><div class="stats"><div class="s"><div class="n" id="views">0</div>Views</div><div class="s"><div class="n" id="calls">0</div>Calls</div><div class="s"><div class="n" id="wa">0</div>WhatsApp</div><div class="s"><div class="n" id="map">0</div>Map</div></div></div><div class="box"><h3>Activity</h3><div id="activity">লোড হচ্ছে...</div></div><a class="back" href="owner-dashboard.html">← Dashboard</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const{data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='owner-login.html';return}const r=await supabaseClient.from('shops').select('id,shop_name').eq('owner_id',session.user.id).order('id',{ascending:false}).limit(1).maybeSingle(),s=r.data;if(!s){shop.textContent='আগে My Shop-এ দোকানের তথ্য সংরক্ষণ করুন।';return}shop.textContent='দোকান: '+s.shop_name;const a=await supabaseClient.from('analytics_events').select('event_type,created_at').eq('shop_id',s.id).order('created_at',{ascending:false}).limit(500);if(a.error){activity.textContent=a.error.message;return}const d=a.data||[],c=t=>d.filter(x=>x.event_type===t).length;views.textContent=c('view');calls.textContent=c('call');wa.textContent=c('whatsapp');map.textContent=c('map');activity.innerHTML=d.length?d.slice(0,30).map(x=>`<div class="row"><span>${x.event_type}</span><small>${new Date(x.created_at).toLocaleString('bn-BD')}</small></div>`).join(''):'এখনো কোনো activity নেই।'})()</script></body></html>
