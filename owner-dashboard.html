<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#0B6E4F"
>

<title>
  Shop Owner Dashboard - Ruhia Upazila Bazar
</title>

<link
  rel="stylesheet"
  href="style.css"
>

<style>

body{
  margin:0;
  background:
    linear-gradient(
      135deg,
      #eef8f3,
      #fff8e8
    );
  color:#19352b;
}

.dashboard{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.topbar{
  background:#0B6E4F;
  color:#fff;
  border-radius:22px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:
    0 8px 25px
    rgba(11,110,79,.15);
}

.topbar h1{
  margin:0 0 7px;
  font-size:25px;
}

.topbar p{
  margin:0;
  opacity:.92;
  font-size:15px;
}

.shop-card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:
    0 8px 28px
    rgba(0,0,0,.07);
}

.shop-card h2{
  margin:0 0 8px;
  font-size:21px;
}

.shop-name{
  font-size:19px;
  font-weight:800;
  color:#0B6E4F;
  margin:5px 0;
}

.shop-meta{
  color:#68766f;
  font-size:14px;
  line-height:1.8;
}

.no-shop{
  color:#68766f;
  line-height:1.7;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.dashboard-link{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:72px;
  padding:15px;
  box-sizing:border-box;
  background:#fff;
  color:#19352b;
  text-decoration:none;
  border-radius:16px;
  font-weight:800;
  box-shadow:
    0 6px 20px
    rgba(0,0,0,.06);
  transition:.2s;
}

.dashboard-link:hover{
  transform:translateY(-2px);
}

.dashboard-link span{
  font-size:25px;
}

.logout{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#c62828;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.logout:hover{
  background:#a91f1f;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#0B6E4F;
  text-decoration:none;
  font-weight:800;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:6px 10px;
  border-radius:20px;
  background:#fff4d6;
  color:#8a5a00;
  font-size:13px;
  font-weight:700;
}

.loading{
  color:#68766f;
}

.notice{
  display:none;
  margin-top:14px;
  padding:11px;
  border-radius:10px;
  background:#fff4d6;
  color:#765000;
  font-size:14px;
}

@media(max-width:520px){

  .dashboard-grid{
    grid-template-columns:1fr;
  }

  .dashboard{
    padding:14px;
  }

  .topbar{
    padding:20px;
  }

}

</style>

</head>


<body>


<main class="dashboard">


<section class="topbar">

<h1>
Shop Owner Dashboard
</h1>

<p id="welcome">
আপনার ব্যবসা পরিচালনা করুন
</p>

</section>


<section class="shop-card">

<h2>
🏪 আমার দোকান
</h2>

<div id="shopInfo">

<p class="loading">
দোকানের তথ্য লোড হচ্ছে...
</p>

</div>

</section>


<section class="dashboard-grid">


<a
class="dashboard-link"
href="owner-shop.html"
>

<span>🏪</span>

<div>
My Shop
</div>

</a>


<a
class="dashboard-link"
href="#"
onclick="comingSoon(event,'📸 Photos')"
>

<span>📸</span>

<div>
Photos
</div>

</a>


<a
class="dashboard-link"
href="owner-products.html"
>

<span>📦</span>

<div>
Products / Services
</div>

</a>


<a
class="dashboard-link"
href="owner-offers.html"
>

<span>🎁</span>

<div>
Offers
</div>

</a>


<a
class="dashboard-link"
href="#"
onclick="comingSoon(event,'🚀 Promotion')"
>

<span>🚀</span>

<div>
Promotion
</div>

</a>


<a
class="dashboard-link"
href="#"
onclick="comingSoon(event,'💳 My Package')"
>

<span>💳</span>

<div>
My Package
</div>

</a>


<a
class="dashboard-link"
href="#"
onclick="comingSoon(event,'💰 Payments')"
>

<span>💰</span>

<div>
Payments
</div>

</a>


<a
class="dashboard-link"
href="#"
onclick="comingSoon(event,'📊 Analytics')"
>

<span>📊</span>

<div>
Analytics
</div>

</a>


</section>


<div
id="notice"
class="notice"
></div>


<button
id="logout"
class="logout"
type="button"
>

🚪 লগআউট

</button>


<a
class="back"
href="index.html"
>

← মূল ওয়েবসাইটে ফিরে যান

</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

/* =========================
   COMING SOON
========================= */

function comingSoon(event, name) {

  event.preventDefault();

  const notice =
    document.getElementById("notice");

  notice.textContent =
    name +
    " ফিচারটি পরবর্তী ধাপে চালু হবে।";

  notice.style.display =
    "block";

}


/* =========================
   HTML SECURITY
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   LOAD DASHBOARD
========================= */

async function loadDashboard() {

  if (!window.supabaseClient) {

    document.getElementById(
      "shopInfo"
    ).innerHTML = `
      <p class="no-shop">
        Supabase সংযোগ পাওয়া যাচ্ছে না।
      </p>
    `;

    return;

  }


  /* =========================
     CHECK LOGIN
  ========================= */

  const {
    data: sessionData,
    error: sessionError
  } =
    await window.supabaseClient
      .auth
      .getSession();


  if (
    sessionError ||
    !sessionData ||
    !sessionData.session
  ) {

    window.location.href =
      "owner-login.html";

    return;

  }


  const user =
    sessionData.session.user;


  /* =========================
     OWNER NAME
  ========================= */

  let ownerName =
    user.user_metadata?.full_name ||
    user.user_metadata?.name ||
    "";


  /*
    Registration-এর সময়
    নাম metadata-তে থাকলে
    এখান থেকে পাওয়া যাবে।
  */

  if (!ownerName) {

    ownerName =
      user.email ||
      "Shop Owner";

  }


  document.getElementById(
    "welcome"
  ).textContent =
    "স্বাগতম, " +
    ownerName +
    " 👋";


  /* =========================
     FIND OWNER SHOP
  ========================= */

  const {
    data: shop,
    error: shopError
  } =
    await window.supabaseClient
      .from("shops")
      .select(`
        id,
        shop_name,
        category,
        mobile,
        whatsapp,
        address,
        locality,
        status,
        package_type,
        package_expires_at,
        featured
      `)
      .eq(
        "owner_id",
        user.id
      )
      .maybeSingle();


  /* =========================
     SHOP ERROR
  ========================= */

  if (shopError) {

    console.error(
      "Shop loading error:",
      shopError
    );

    document.getElementById(
      "shopInfo"
    ).innerHTML = `

      <p class="no-shop">

        দোকানের তথ্য লোড করা যায়নি।

      </p>

      <p
        style="
          font-size:12px;
          color:#888;
        "
      >

        ${escapeHtml(
          shopError.message
        )}

      </p>

    `;

    return;

  }


  /* =========================
     NO SHOP
  ========================= */

  if (!shop) {

    document.getElementById(
      "shopInfo"
    ).innerHTML = `

      <p class="no-shop">

        দোকানের তথ্য এখনো যোগ করা হয়নি।

      </p>

      <a
        href="owner-shop.html"
        style="
          display:inline-block;
          margin-top:8px;
          color:#0B6E4F;
          font-weight:800;
          text-decoration:none;
        "
      >

        ➕ এখনই দোকানের তথ্য যোগ করুন

      </a>

    `;

    return;

  }


  /* =========================
     STATUS
  ========================= */

  const rawStatus =
    String(
      shop.status ||
      "pending"
    );


  let statusText =
    "স্ট্যাটাস: " +
    rawStatus;


  if (
    rawStatus.toLowerCase() ===
    "active"
  ) {

    statusText =
      "স্ট্যাটাস: Active";

  }


  /* =========================
     PACKAGE
  ========================= */

  const packageText =
    shop.package_type ||
    "Package নির্বাচন করা হয়নি";


  /* =========================
     PACKAGE EXPIRY
  ========================= */

  let expiryText =
    "";


  if (
    shop.package_expires_at
  ) {

    const expiry =
      new Date(
        shop.package_expires_at
      );


    if (
      !Number.isNaN(
        expiry.getTime()
      )
    ) {

      expiryText =
        "প্যাকেজ শেষ হবে: " +
        expiry.toLocaleDateString(
          "bn-BD"
        );

    }

  }


  /* =========================
     FEATURED
  ========================= */

  const featuredText =
    shop.featured
      ? `
        <br>
        ⭐ Featured Shop
      `
      : "";


  /* =========================
     SHOW SHOP INFORMATION
  ========================= */

  document.getElementById(
    "shopInfo"
  ).innerHTML = `

    <div class="shop-name">

      ${escapeHtml(
        shop.shop_name ||
        "দোকানের নাম নেই"
      )}

    </div>


    <div class="shop-meta">

      📂 ক্যাটাগরি:
      ${escapeHtml(
        shop.category ||
        "নির্ধারিত নয়"
      )}

      <br>

      📱 মোবাইল:
      ${escapeHtml(
        shop.mobile ||
        "নেই"
      )}

      <br>

      📍 ঠিকানা:
      ${escapeHtml(
        shop.address ||
        "নেই"
      )}

      ${
        shop.locality
          ? `
            <br>

            📌 এলাকা:
            ${escapeHtml(
              shop.locality
            )}
          `
          : ""
      }

      <br>

      📦 প্যাকেজ:
      ${escapeHtml(
        packageText
      )}

      ${
        expiryText
          ? `
            <br>

            ${escapeHtml(
              expiryText
            )}
          `
          : ""
      }

      ${featuredText}

    </div>


    <div class="status">

      ${escapeHtml(
        statusText
      )}

    </div>

  `;

}


/* =========================
   LOGOUT
========================= */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    async function() {

      const button =
        document.getElementById(
          "logout"
        );


      button.disabled =
        true;


      button.textContent =
        "⏳ লগআউট হচ্ছে...";


      if (
        !window.supabaseClient
      ) {

        window.location.href =
          "owner-login.html";

        return;

      }


      const {
        error
      } =
        await window.supabaseClient
          .auth
          .signOut();


      if (error) {

        console.error(
          "Logout error:",
          error
        );


        alert(
          "লগআউট করা যায়নি। আবার চেষ্টা করুন।"
        );


        button.disabled =
          false;


        button.textContent =
          "🚪 লগআউট";

        return;

      }


      window.location.href =
        "owner-login.html";

    }
  );


/* =========================
   START
========================= */

loadDashboard();

</script>

</body>
</html>
</main>
