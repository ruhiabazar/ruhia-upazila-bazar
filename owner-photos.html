<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photos</title><style>body{font-family:Arial;background:#f4f8f5;color:#173b2d;margin:0}.w{max-width:700px;margin:auto;padding:18px}.box{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #0001}.h{background:#0b6e4f;color:#fff;border-radius:18px;padding:20px}input,button{width:100%;padding:13px;margin:6px 0;box-sizing:border-box;border-radius:12px;border:1px solid #ccd8d2}button{background:#0b6e4f;color:#fff;border:0;font-weight:700}.p{display:flex;gap:10px;align-items:center;border-top:1px solid #eee;padding:12px 0}.p img{width:85px;height:65px;object-fit:cover;border-radius:9px}.del{width:auto;background:#d52b2b;padding:8px}.back{color:#0b6e4f;font-weight:700}</style></head><body><main class="w"><div class="h"><h2>📸 Photos</h2><div id="shop">লোড হচ্ছে...</div></div><div class="box"><h3>ছবি যোগ করুন</h3><p>ছবির সরাসরি URL দিন। Demo ছবি নেই।</p><input id="url" placeholder="https://..."><input id="cap" placeholder="বিবরণ (ঐচ্ছিক)"><button id="add">সংরক্ষণ করুন</button><div id="msg"></div></div><div class="box"><h3>আমার ছবি</h3><div id="list">লোড হচ্ছে...</div></div><a class="back" href="owner-dashboard.html">← Dashboard</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>let u,s;async function init(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='owner-login.html';return}u=session.user;const r=await supabaseClient.from('shops').select('id,shop_name').eq('owner_id',u.id).order('id',{ascending:false}).limit(1).maybeSingle();s=r.data;if(!s){document.getElementById('shop').textContent='আগে My Shop-এ দোকানের তথ্য সংরক্ষণ করুন।';return}document.getElementById('shop').textContent='দোকান: '+s.shop_name;load()}async function load(){const{data,error}=await supabaseClient.from('shop_photos').select('*').eq('shop_id',s.id).order('created_at',{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=data?.length?data.map(x=>`<div class="p"><img src="${x.image_url}" alt=""><div style="flex:1">${x.caption||'দোকানের ছবি'}</div><button class="del" onclick="del(${x.id})">মুছুন</button></div>`).join(''):'এখনো কোনো ছবি যোগ করা হয়নি।'}async function del(id){if(!confirm('ছবি মুছবেন?'))return;await supabaseClient.from('shop_photos').delete().eq('id',id).eq('owner_id',u.id);load()}add.onclick=async()=>{const image_url=url.value.trim();if(!image_url){msg.textContent='ছবির URL দিন।';return}const{error}=await supabaseClient.from('shop_photos').insert({shop_id:s.id,owner_id:u.id,image_url,caption:cap.value.trim()});msg.textContent=error?error.message:'ছবি সফলভাবে সংরক্ষণ হয়েছে।';if(!error){url.value='';cap.value='';load()}};init();</script></body></html>
