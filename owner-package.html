<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Package</title><style>body{font-family:Arial;background:#f4f8f5;color:#173b2d;margin:0}.w{max-width:700px;margin:auto;padding:18px}.h,.box{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 5px 18px #0001}.h{background:#0b6e4f;color:#fff}.status{font-size:28px;font-weight:800;color:#0b6e4f}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.back{color:#0b6e4f;font-weight:700}</style></head><body><main class="w"><div class="h"><h2>💳 My Package</h2><div id="shop">লোড হচ্ছে...</div></div><div class="box" id="box">লোড হচ্ছে...</div><a class="back" href="owner-dashboard.html">← Dashboard</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>(async()=>{const{data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='owner-login.html';return}const r=await supabaseClient.from('shops').select('*').eq('owner_id',session.user.id).order('id',{ascending:false}).limit(1).maybeSingle(),s=r.data;if(!s){box.textContent='আগে My Shop-এ দোকানের তথ্য সংরক্ষণ করুন।';return}shop.textContent=s.shop_name||'আমার দোকান';box.innerHTML=`<div class="status">${s.package_type||'কোনো package নেই'}</div><div class="row"><span>শুরু</span><b>${s.package_started_at?new Date(s.package_started_at).toLocaleDateString('bn-BD'):'—'}</b></div><div class="row"><span>মেয়াদ শেষ</span><b>${s.package_expires_at?new Date(s.package_expires_at).toLocaleDateString('bn-BD'):'—'}</b></div><p>Payment verification-এর পর package activation হবে।</p>`})()</script></body></html>
