<!doctype html>
<html lang="bn">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B6E4F">

<title>My Shop - Ruhia Upazila Bazar</title>

<link rel="stylesheet" href="style.css">

<style>

body{
  margin:0;
  background:linear-gradient(135deg,#eef8f3,#fff8e8);
  color:#19352b;
}

.shop-page{
  max-width:760px;
  margin:auto;
  padding:18px;
}

.header{
  background:#0B6E4F;
  color:#fff;
  border-radius:22px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(11,110,79,.15);
}

.header h1{
  margin:0 0 6px;
  font-size:25px;
}

.header p{
  margin:0;
  opacity:.9;
}

.form-card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 28px rgba(0,0,0,.07);
}

.field{
  margin:16px 0;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border:1px solid #d7dfdb;
  border-radius:12px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:#0B6E4F;
  box-shadow:0 0 0 3px rgba(11,110,79,.10);
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:0 14px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#0B6E4F;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  background:#095b42;
}

button:disabled{
  opacity:.7;
  cursor:not-allowed;
}

.msg{
  display:none;
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  line-height:1.5;
}

.ok{
  display:block;
  background:#e9f8ef;
  color:#17653e;
}

.err{
  display:block;
  background:#fff0f0;
  color:#a32626;
}

.back{
  display:block;
  text-align:center;
  margin-top:16px;
  color:#0B6E4F;
  text-decoration:none;
  font-weight:700;
}

.note{
  color:#68766f;
  font-size:13px;
  line-height:1.6;
}

@media(min-width:650px){

  .grid{
    grid-template-columns:1fr 1fr;
  }

}

</style>
</head>

<body>

<main class="shop-page">

  <section class="header">

    <h1>🏪 My Shop</h1>

    <p>
      আপনার ব্যবসার তথ্য যোগ ও পরিচালনা করুন
    </p>

  </section>


  <section class="form-card">

    <form id="shopForm">


      <!-- দোকানের নাম -->

      <div class="field">

        <label for="shopName">
          দোকানের নাম *
        </label>

        <input
          id="shopName"
          type="text"
          required
          autocomplete="organization"
          placeholder="আপনার দোকানের নাম"
        >

      </div>


      <!-- ক্যাটাগরি -->

      <div class="field">

        <label for="category">
          ক্যাটাগরি *
        </label>

        <select
          id="category"
          required
        >

          <option value="">
            ক্যাটাগরি নির্বাচন করুন
          </option>

          <option>মুদিখানা</option>
          <option>পোশাক ও ফ্যাশন</option>
          <option>জুতা ও ব্যাগ</option>
          <option>কসমেটিকস</option>
          <option>জুয়েলারি</option>
          <option>মোবাইল ও কম্পিউটার</option>
          <option>ইলেকট্রনিক্স</option>
          <option>রেস্টুরেন্ট ও খাবার</option>
          <option>বেকারি ও মিষ্টি</option>
          <option>ফার্মেসি</option>
          <option>ডাক্তার ও ক্লিনিক</option>
          <option>বিউটি ও সেলুন</option>
          <option>শিক্ষা</option>
          <option>কোচিং সেন্টার</option>
          <option>সার্ভিসেস</option>
          <option>প্রিন্টিং ও ফটোকপি</option>
          <option>ফটোগ্রাফি ও স্টুডিও</option>
          <option>হার্ডওয়্যার ও নির্মাণ সামগ্রী</option>
          <option>ফার্নিচার</option>
          <option>অটো, গাড়ি ও পরিবহন</option>
          <option>বাইক/গাড়ির পার্টস ও সার্ভিস</option>
          <option>কৃষি ও কৃষি সামগ্রী</option>
          <option>গবাদিপশু ও পোলট্রি</option>
          <option>জমি, বাড়ি ও রিয়েল এস্টেট</option>
          <option>ব্যবসায়িক ও পেশাগত সেবা</option>
          <option>ইভেন্ট ও ডেকোরেশন</option>
          <option>হোম সার্ভিস</option>

        </select>

      </div>


      <!-- মোবাইল + WhatsApp -->

      <div class="grid">

        <div class="field">

          <label for="mobile">
            মোবাইল নম্বর *
          </label>

          <input
            id="mobile"
            type="tel"
            required
            inputmode="tel"
            autocomplete="tel"
            placeholder="01XXXXXXXXX"
          >

        </div>


        <div class="field">

          <label for="whatsapp">
            WhatsApp নম্বর
          </label>

          <input
            id="whatsapp"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="01XXXXXXXXX"
          >

        </div>

      </div>


      <!-- ঠিকানা -->

      <div class="field">

        <label for="address">
          সম্পূর্ণ ঠিকানা *
        </label>

        <input
          id="address"
          type="text"
          required
          autocomplete="street-address"
          placeholder="যেমন: কলেজ রোড, রুহিয়া"
        >

      </div>


      <!-- এলাকা -->

      <div class="field">

        <label for="locality">
          এলাকা / লোকেশন
        </label>

        <input
          id="locality"
          type="text"
          placeholder="যেমন: কলেজ রোড / হাজী মার্কেট / স্টেশন রোড"
        >

      </div>


      <!-- বিস্তারিত -->

      <div class="field">

        <label for="description">
          দোকানের বিস্তারিত
        </label>

        <textarea
          id="description"
          placeholder="আপনার দোকান বা ব্যবসা সম্পর্কে লিখুন..."
        ></textarea>

      </div>


      <!-- সময় -->

      <div class="grid">

        <div class="field">

          <label for="opening">
            খোলার সময়
          </label>

          <input
            id="opening"
            type="time"
          >

        </div>


        <div class="field">

          <label for="closing">
            বন্ধের সময়
          </label>

          <input
            id="closing"
            type="time"
          >

        </div>

      </div>


      <!-- Google Maps -->

      <div class="field">

        <label for="mapUrl">
          Google Maps Link
        </label>

        <input
          id="mapUrl"
          type="url"
          placeholder="https://maps.google.com/..."
        >

      </div>


      <p class="note">

        ⭐ দোকানের তথ্য সঠিকভাবে দিন।
        পরবর্তীতে এই তথ্য আপনার পাবলিক Shop Profile-এ দেখানো হবে।

      </p>


      <button
        id="saveBtn"
        type="submit"
      >
        💾 দোকানের তথ্য সংরক্ষণ করুন
      </button>


    </form>


    <div
      id="msg"
      class="msg"
    ></div>


    <a
      class="back"
      href="owner-dashboard.html"
    >
      ← Dashboard-এ ফিরে যান
    </a>


  </section>

</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const form = document.getElementById("shopForm");
const msg = document.getElementById("msg");
const saveBtn = document.getElementById("saveBtn");

let currentShopId = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text, type) {

  msg.textContent = text;
  msg.className = "msg " + type;

}


/* =========================
   MOBILE VALIDATION
========================= */

function validBDMobile(number) {

  return /^01[3-9]\d{8}$/.test(number);

}


/* =========================
   CREATE SLUG
========================= */

function createSlug(shopName, userId) {

  const englishSlug = shopName
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");


  /*
    বাংলা নাম হলে ইংরেজি অক্ষর পাওয়া নাও যেতে পারে।
    তাই user ID থেকে unique অংশ যোগ করা হবে।
  */

  const safeId =
    String(userId)
      .replace(/[^a-zA-Z0-9]/g, "")
      .slice(0, 12)
      .toLowerCase();


  if (englishSlug) {

    return englishSlug + "-" + safeId;

  }


  return "shop-" + safeId;

}


/* =========================
   LOAD SHOP
========================= */

async function loadShop() {

  if (!window.supabaseClient) {

    showMessage(
      "Supabase সংযোগ পাওয়া যাচ্ছে না।",
      "err"
    );

    return;

  }


  const {
    data: { session },
    error: sessionError
  } =
    await window.supabaseClient.auth.getSession();


  if (sessionError || !session) {

    window.location.href =
      "owner-login.html";

    return;

  }


  const userId =
    session.user.id;


  const {
    data: shop,
    error
  } =
    await window.supabaseClient
      .from("shops")
      .select("*")
      .eq("owner_id", userId)
      .maybeSingle();


  if (error) {

    console.error(
      "Shop load error:",
      error
    );

    showMessage(
      "দোকানের তথ্য লোড করা যায়নি।",
      "err"
    );

    return;

  }


  if (!shop) {

    return;

  }


  currentShopId =
    shop.id;


  /* Database-এর আসল column */

  document.getElementById("shopName").value =
    shop.shop_name || "";


  document.getElementById("category").value =
    shop.category || "";


  document.getElementById("mobile").value =
    shop.mobile || "";


  document.getElementById("whatsapp").value =
    shop.whatsapp || "";


  document.getElementById("address").value =
    shop.address || "";


  document.getElementById("locality").value =
    shop.locality || "";


  document.getElementById("description").value =
    shop.description || "";


  document.getElementById("mapUrl").value =
    shop.map_url || "";


  /* Opening hours */

  if (shop.opening_hours) {

    const parts =
      shop.opening_hours.split(" - ");


    if (parts.length === 2) {

      document.getElementById("opening").value =
        parts[0].trim();


      document.getElementById("closing").value =
        parts[1].trim();

    }

  }

}


/* =========================
   SAVE SHOP
========================= */

form.addEventListener(
  "submit",
  async function(e) {

    e.preventDefault();


    if (!window.supabaseClient) {

      showMessage(
        "Supabase সংযোগ পাওয়া যাচ্ছে না।",
        "err"
      );

      return;

    }


    const {
      data: { session },
      error: sessionError
    } =
      await window.supabaseClient.auth.getSession();


    if (
      sessionError ||
      !session
    ) {

      window.location.href =
        "owner-login.html";

      return;

    }


    const userId =
      session.user.id;


    /* =========================
       FORM VALUES
    ========================= */

    const shopName =
      document
        .getElementById("shopName")
        .value
        .trim();


    const category =
      document
        .getElementById("category")
        .value;


    const mobile =
      document
        .getElementById("mobile")
        .value
        .trim();


    const whatsapp =
      document
        .getElementById("whatsapp")
        .value
        .trim();


    const address =
      document
        .getElementById("address")
        .value
        .trim();


    const locality =
      document
        .getElementById("locality")
        .value
        .trim();


    const description =
      document
        .getElementById("description")
        .value
        .trim();


    const opening =
      document
        .getElementById("opening")
        .value;


    const closing =
      document
        .getElementById("closing")
        .value;


    const mapUrl =
      document
        .getElementById("mapUrl")
        .value
        .trim();


    /* =========================
       VALIDATION
    ========================= */

    if (!shopName) {

      showMessage(
        "দোকানের নাম দিন।",
        "err"
      );

      return;

    }


    if (!category) {

      showMessage(
        "একটি ক্যাটাগরি নির্বাচন করুন।",
        "err"
      );

      return;

    }


    if (!validBDMobile(mobile)) {

      showMessage(
        "সঠিক বাংলাদেশি মোবাইল নম্বর দিন।",
        "err"
      );

      return;

    }


    if (
      whatsapp &&
      !validBDMobile(whatsapp)
    ) {

      showMessage(
        "সঠিক WhatsApp নম্বর দিন।",
        "err"
      );

      return;

    }


    if (!address) {

      showMessage(
        "দোকানের ঠিকানা দিন।",
        "err"
      );

      return;

    }


    /* =========================
       OPENING HOURS
    ========================= */

    let openingHours = null;


    if (
      opening &&
      closing
    ) {

      openingHours =
        opening + " - " + closing;

    } else if (opening) {

      openingHours =
        opening;

    } else if (closing) {

      openingHours =
        closing;

    }


    /* =========================
       SLUG
    ========================= */

    let slug = null;


    if (currentShopId) {

      /*
        পুরোনো দোকানের slug থাকলে
        সেটাই রাখা হবে।
      */

      const {
        data: oldShop
      } =
        await window.supabaseClient
          .from("shops")
          .select("slug")
          .eq("id", currentShopId)
          .eq("owner_id", userId)
          .maybeSingle();


      if (
        oldShop &&
        oldShop.slug
      ) {

        slug =
          oldShop.slug;

      }

    }


    /*
      নতুন দোকানের জন্য
      automatic unique slug
    */

    if (!slug) {

      slug =
        createSlug(
          shopName,
          userId
        );

    }


    /* =========================
       DATABASE DATA
    ========================= */

    const shopData = {

      owner_id: userId,

      shop_name: shopName,

      slug: slug,

      category: category,

      mobile: mobile,

      whatsapp:
        whatsapp || null,

      address: address,

      locality:
        locality || null,

      description:
        description || null,

      opening_hours:
        openingHours,

      map_url:
        mapUrl || null

    };


    /* =========================
       BUTTON LOADING
    ========================= */

    saveBtn.disabled = true;

    saveBtn.textContent =
      "⏳ সংরক্ষণ হচ্ছে...";


    try {

      let result;


      /* =========================
         EXISTING SHOP UPDATE
      ========================= */

      if (currentShopId) {

        result =
          await window.supabaseClient
            .from("shops")
            .update(shopData)
            .eq(
              "id",
              currentShopId
            )
            .eq(
              "owner_id",
              userId
            );

      }


      /* =========================
         NEW SHOP
      ========================= */

      else {

        /*
          আগে দেখি এই owner-এর
          দোকান আছে কি না।
        */

        const {
          data: existingShop,
          error: checkError
        } =
          await window.supabaseClient
            .from("shops")
            .select("id,slug")
            .eq(
              "owner_id",
              userId
            )
            .maybeSingle();


        if (checkError) {

          throw checkError;

        }


        /* Existing shop */

        if (existingShop) {

          currentShopId =
            existingShop.id;


          /*
            Existing slug থাকলে
            সেটি রাখা হবে।
          */

          if (
            existingShop.slug
          ) {

            shopData.slug =
              existingShop.slug;

          }


          result =
            await window.supabaseClient
              .from("shops")
              .update(shopData)
              .eq(
                "id",
                existingShop.id
              )
              .eq(
                "owner_id",
                userId
              );

        }


        /* New shop */

        else {

          result =
            await window.supabaseClient
              .from("shops")
              .insert(shopData)
              .select("id")
              .single();


          if (
            result.data &&
            result.data.id
          ) {

            currentShopId =
              result.data.id;

          }

        }

      }


      /* =========================
         DATABASE ERROR
      ========================= */

      if (result.error) {

        console.error(
          "Shop save error:",
          result.error
        );


        showMessage(
          result.error.message ||
          "দোকানের তথ্য সংরক্ষণ করা যায়নি।",
          "err"
        );

        return;

      }


      /* =========================
         SUCCESS
      ========================= */

      showMessage(
        "✅ দোকানের তথ্য সফলভাবে সংরক্ষণ হয়েছে।",
        "ok"
      );


    } catch (error) {

      console.error(
        "Unexpected error:",
        error
      );


      showMessage(
        error.message ||
        "একটি সমস্যা হয়েছে। আবার চেষ্টা করুন।",
        "err"
      );


    } finally {

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "💾 দোকানের তথ্য সংরক্ষণ করুন";

    }

  }
);


/* =========================
   PAGE LOAD
========================= */

loadShop();

</script>

</body>
</html>
