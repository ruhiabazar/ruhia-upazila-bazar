<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Owner Registration - Ruhia Upazila Bazar</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#f5f7f6}.auth{max-width:560px;margin:40px auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.field{margin:14px 0}.field label{display:block;font-weight:600;margin-bottom:7px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7dfdb;border-radius:10px;font-size:16px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#0B6E4F;color:#fff;font-size:16px;font-weight:700}
.msg{margin-top:14px;padding:12px;border-radius:10px;display:none;line-height:1.5}.ok{display:block;background:#e9f8ef;color:#17653e}.err{display:block;background:#fff0f0;color:#a32626}a{color:#0B6E4F}
</style>
</head>
<body>
<main class="auth"><div class="card">
<h1>Shop Owner Account</h1>
<p>রুহিয়া বাজারে আপনার ব্যবসা যোগ করতে অ্যাকাউন্ট তৈরি করুন।</p>
<form id="form">
<div class="field"><label>মালিকের নাম *</label><input id="name" required autocomplete="name"></div>
<div class="field"><label>মোবাইল নম্বর *</label><input id="mobile" required inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX"></div>
<div class="field"><label>ইমেইল (ঐচ্ছিক)</label><input id="email" type="email" autocomplete="email"></div>
<div class="field"><label>পাসওয়ার্ড *</label><input id="password" type="password" required minlength="6" autocomplete="new-password"></div>
<div class="field"><label>পাসওয়ার্ড আবার লিখুন *</label><input id="confirm" type="password" required minlength="6" autocomplete="new-password"></div>
<div class="field"><label><input id="terms" type="checkbox" required> আমি শর্তাবলি মেনে নিচ্ছি।</label></div>
<button type="submit">অ্যাকাউন্ট তৈরি করুন</button>
</form>
<div id="msg" class="msg"></div>
<p>ইমেইল না দিলে মোবাইল authentication ব্যবহার হবে; Supabase-এ Phone provider চালু থাকতে হবে।</p>
<p>আগে অ্যাকাউন্ট আছে? <a href="owner-login.html">লগইন করুন</a></p>
<p><a href="index.html">← মূল ওয়েবসাইট</a></p>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const form=document.getElementById("form"),msg=document.getElementById("msg");
function show(t,c){msg.textContent=t;msg.className="msg "+c}
form.addEventListener("submit",async e=>{
 e.preventDefault();
 const fullName=document.getElementById("name").value.trim();
 const mobile=document.getElementById("mobile").value.trim();
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(password!==document.getElementById("confirm").value){show("দুইটি পাসওয়ার্ড একই নয়।","err");return}
 if(!/^01[3-9]\d{8}$/.test(mobile)){show("সঠিক বাংলাদেশি মোবাইল নম্বর দিন।","err");return}
 try{
  const c={password,options:{data:{full_name:fullName,mobile}}};
  if(email)c.email=email;else c.phone="+88"+mobile;
  const {data,error}=await supabaseClient.auth.signUp(c);
  if(error)throw error;
  if(data.session){show("অ্যাকাউন্ট তৈরি হয়েছে।","ok");setTimeout(()=>location.href="owner-login.html",1000)}
  else{show(email?"অ্যাকাউন্ট তৈরি হয়েছে। ইমেইল verification সম্পন্ন করে লগইন করুন।":"অ্যাকাউন্ট তৈরি হয়েছে। এখন লগইন করুন।","ok");form.reset()}
 }catch(err){show(err.message||"রেজিস্ট্রেশন সম্পন্ন হয়নি।","err")}
});
</script>
</body>
</html>
