<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Owner Registration - Ruhia Upazila Bazar</title>
<link rel="stylesheet" href="style.css">

<style>
body{
  background:linear-gradient(135deg,#eaf7f1,#fff8e8);
  min-height:100vh;
}

.auth{
  max-width:560px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:24px;
  box-shadow:0 12px 40px rgba(11,110,79,.12);
}

.logo{
  width:64px;
  height:64px;
  border-radius:18px;
  background:#0B6E4F;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:800;
  margin-bottom:16px;
}

h1{
  margin:0 0 8px;
  color:#0B6E4F;
}

.intro{
  color:#5b6b64;
  line-height:1.6;
}

.field{
  margin:15px 0;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
  color:#24352e;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border:1px solid #d7dfdb;
  border-radius:12px;
  font-size:16px;
  background:#fff;
}

input:focus{
  outline:none;
  border-color:#0B6E4F;
  box-shadow:0 0 0 3px rgba(11,110,79,.10);
}

.terms{
  display:flex !important;
  align-items:flex-start;
  gap:8px;
  font-weight:500 !important;
  line-height:1.5;
}

.terms input{
  width:auto;
  margin-top:4px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#0B6E4F;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  background:#095b42;
}

.msg{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  display:none;
  line-height:1.5;
}

.ok{
  display:block;
  background:#e9f8ef;
  color:#17653e;
}

.err{
  display:block;
  background:#fff0f0;
  color:#a32626;
}

a{
  color:#0B6E4F;
  font-weight:700;
  text-decoration:none;
}

.note{
  font-size:13px;
  color:#6b7772;
  line-height:1.6;
}
</style>
</head>

<body>

<main class="auth">
  <div class="card">

    <div class="logo">RB</div>

    <h1>Shop Owner Account</h1>

    <p class="intro">
      রুহিয়া বাজারে আপনার ব্যবসা যোগ করতে অ্যাকাউন্ট তৈরি করুন।
    </p>

    <form id="form">

      <div class="field">
        <label>মালিকের নাম *</label>
        <input
          id="name"
          required
          autocomplete="name"
          placeholder="আপনার নাম"
        >
      </div>

      <div class="field">
        <label>মোবাইল নম্বর *</label>
        <input
          id="mobile"
          required
          inputmode="tel"
          autocomplete="tel"
          placeholder="01XXXXXXXXX"
        >
      </div>

      <div class="field">
        <label>ইমেইল (ঐচ্ছিক)</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="example@email.com"
        >
      </div>

      <div class="field">
        <label>পাসওয়ার্ড *</label>
        <input
          id="password"
          type="password"
          required
          minlength="6"
          autocomplete="new-password"
          placeholder="কমপক্ষে ৬ অক্ষর"
        >
      </div>

      <div class="field">
        <label>পাসওয়ার্ড আবার লিখুন *</label>
        <input
          id="confirm"
          type="password"
          required
          minlength="6"
          autocomplete="new-password"
          placeholder="পাসওয়ার্ড আবার দিন"
        >
      </div>

      <div class="field">
        <label class="terms">
          <input id="terms" type="checkbox" required>
          <span>আমি রুহিয়া উপজেলা বাজারের শর্তাবলি মেনে নিচ্ছি।</span>
        </label>
      </div>

      <button type="submit">
        অ্যাকাউন্ট তৈরি করুন
      </button>

    </form>

    <div id="msg" class="msg"></div>

    <p class="note">
      ইমেইল দিলে ইমেইল দিয়ে অ্যাকাউন্ট তৈরি হবে।
      ইমেইল না দিলে মোবাইল authentication ব্যবহার হবে,
      যদি Supabase Phone provider চালু থাকে।
    </p>

    <p>
      আগে অ্যাকাউন্ট আছে?
      <a href="owner-login.html">লগইন করুন</a>
    </p>

    <p>
      <a href="index.html">← মূল ওয়েবসাইটে ফিরে যান</a>
    </p>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script><script>
const form = document.getElementById("form");
const msg = document.getElementById("msg");

function showMessage(text, type) {
  msg.textContent = text;
  msg.className = "msg " + type;
}

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const fullName = document.getElementById("name").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirm").value;

  if (password !== confirmPassword) {
    showMessage("দুইটি পাসওয়ার্ড একই নয়।", "err");
    return;
  }

  if (!/^01[3-9]\d{8}$/.test(mobile)) {
    showMessage("সঠিক বাংলাদেশি মোবাইল নম্বর দিন।", "err");
    return;
  }

  if (!window.supabaseClient) {
    showMessage(
      "Supabase সংযোগ পাওয়া যাচ্ছে না। কিছুক্ষণ পরে আবার চেষ্টা করুন।",
      "err"
    );
    return;
  }

  try {
    const signupData = {
      password: password,
      options: {
        data: {
          full_name: fullName,
          mobile: mobile
        }
      }
    };

    if (email) {
      signupData.email = email;
    } else {
      signupData.phone = "+88" + mobile;
    }

    const { data, error } =
      await window.supabaseClient.auth.signUp(signupData);

    if (error) {
      throw error;
    }

    if (data.session) {
      showMessage(
        "অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে। লগইন পেজে নেওয়া হচ্ছে...",
        "ok"
      );

      setTimeout(function() {
        window.location.href = "owner-login.html";
      }, 1200);

    } else {
      if (email) {
        showMessage(
          "অ্যাকাউন্ট তৈরি হয়েছে। আপনার ইমেইল verification সম্পন্ন করে লগইন করুন।",
          "ok"
        );
      } else {
        showMessage(
          "অ্যাকাউন্ট তৈরি হয়েছে। এখন লগইন করুন।",
          "ok"
        );
      }

      form.reset();
    }

  } catch (error) {
    console.error("Registration error:", error);

    showMessage(
      error.message || "রেজিস্ট্রেশন সম্পন্ন হয়নি।",
      "err"
    );
  }
});
</script>

</body>
</html>
