<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Promotion</title><style>body{font-family:Arial;background:#f4f8f5;color:#173b2d;margin:0}.w{max-width:700px;margin:auto;padding:18px}.h,.box{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 5px 18px #0001}.h{background:#0b6e4f;color:#fff}.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px}.plan{border:2px solid #dbe7e1;border-radius:15px;padding:16px}.price{font-size:28px;font-weight:800;color:#0b6e4f}button{width:100%;padding:13px;border:0;border-radius:12px;background:#0b6e4f;color:#fff;font-weight:700}.item{border-top:1px solid #eee;padding:11px 0}.back{color:#0b6e4f;font-weight:700}@media(max-width:520px){.plans{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="h"><h2>🚀 Promotion</h2><p>Promotion package নির্বাচন করুন।</p></div><div class="box"><div class="plans"><div class="plan"><h3>Basic</h3><div class="price">৳499</div><p>৩০ দিন</p><button onclick="choose('499',499)">নিন</button></div><div class="plan"><h3>Premium</h3><div class="price">৳999</div><p>৩০ দিন</p><button onclick="choose('999',999)">নিন</button></div></div><p id="msg"></p></div><div class="box"><h3>আমার Promotion</h3><div id="list">লোড হচ্ছে...</div></div><a class="back" href="owner-dashboard.html">← Dashboard</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>let u,s;async function init(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href='owner-login.html';return}u=session.user;const r=await supabaseClient.from('shops').select('id,shop_name').eq('owner_id',u.id).order('id',{ascending:false}).limit(1).maybeSingle();s=r.data;load()}async function choose(p,a){if(!s){msg.textContent='আগে My Shop-এ দোকান সংরক্ষণ করুন।';return}const{error}=await supabaseClient.from('promotions').insert({shop_id:s.id,owner_id:u.id,package_type:p,amount:a,status:'pending'});msg.textContent=error?error.message:'Promotion request জমা হয়েছে। Payments থেকে payment তথ্য দিন।';if(!error)load()}async function load(){if(!s){list.textContent='দোকানের তথ্য পাওয়া যায়নি।';return}const{data,error}=await supabaseClient.from('promotions').select('*').eq('owner_id',u.id).eq('shop_id',s.id).order('created_at',{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=data?.length?data.map(x=>`<div class="item"><b>৳${x.amount}</b> • ${x.package_type} • ${x.status}<br><small>${new Date(x.created_at).toLocaleString('bn-BD')}</small></div>`).join(''):'কোনো Promotion request নেই।'}init();</script></body></html>
